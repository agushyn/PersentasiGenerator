[package]
name = "arya-duta-persentasion-studio"
version = "0.1.0"
description = "Arya Duta Persentasion Studio"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
